  </circle>
  <text x="700.0" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#6B7F9E">DESIGN · ANALYZE · VALIDATE · PRODUCE</text>
